name: Publish Prerelease

on:
  push:
    branches: [ alpha, beta ]

# Queued per branch so version numbers never collide.
concurrency:
  group: prerelease-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.ref_name }}
          PLUGIN_ID: '18813'
        run: |
          stable=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ ! "$stable" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Latest release tag '$stable' is not X.Y.Z"
            exit 1
          fi
          base="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"

          planned=$(grep -m 1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ' || true)
          if [[ -n "$planned" && "$planned" != "$stable" \
            && "$(printf '%s\n' "$stable" "$planned" | sort -V | tail -n 1)" == "$planned" ]]; then
            base="$planned"
          fi

          pattern="^${base//./\\.}-${CHANNEL}([0-9]+)(\\+|$)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$base-$CHANNEL" \
            --jq '.[].ref | ltrimstr("refs/tags/")' > tags.txt
          # Tags also count, in case the API lags behind uploads.
          {
            curl -fsS "https://plugins.jetbrains.com/api/plugins/$PLUGIN_ID/updates?channel=$CHANNEL&size=100" \
              | jq -r '.[].version'
            cat tags.txt
          } > versions.txt
          last=$(sed -nE "s/${pattern}.*/\\1/p" versions.txt | sort -n | tail -n 1)

          # Release notes compare against this channel's previous tag.
          previous=$(grep -E "^${base//./\\.}-${CHANNEL}[0-9]+$" tags.txt | sort -V | tail -n 1 || true)

          version="$base-$CHANNEL$(( ${last:-0} + 1 ))"
          echo "Publishing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=${previous:-$stable}" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    uses: ./.github/workflows/publish-marketplace.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: ${{ github.ref_name }}
    secrets: inherit

  release:
    needs: [ version, publish ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-distributions
          path: distributions

      - name: Create GitHub Prerelease
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          previous_tag: ${{ needs.version.outputs.previous }}
          fail_on_unmatched_files: true
          files: distributions/*.zip
