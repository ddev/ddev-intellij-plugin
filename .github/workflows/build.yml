name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Platform variants, see platformVariants in build.gradle.kts
        variant: [ '251', '261' ]

    steps:
      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Validate wrapper
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v6

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build project
        run: ./gradlew buildPlugin --exclude-task test -PplatformVariant=${{ matrix.variant }}

      - name: Upload Assets
        uses: actions/upload-artifact@v7
        with:
          name: ddev-intellij-plugin-${{ matrix.variant }}
          path: build/distributions/*.zip
