name: Publish Release

on:
  release:
    types: [released]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Prereleases come from the alpha and beta branches.
      - name: Require a stable version tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable releases need an X.Y.Z tag, got '$TAG'"
            exit 1
          fi

  publish:
    needs: validate
    uses: ./.github/workflows/publish-marketplace.yml
    with:
      version: ${{ github.event.release.tag_name }}
    secrets: inherit

  attach:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-distributions
          path: distributions

      - name: Update GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: distributions/*.zip
